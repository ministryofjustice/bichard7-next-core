name: Test Characterisation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
      
jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
    
    outputs:
      should_run: ${{ steps.evaluate.outputs.should_run }}

    steps: 
      - name: Checkout repository
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4

      - name: Evaluate Run Condition
        id: evaluate
        uses: ./.github/actions/path-filter
        with:
          filters: |
            github:
              - '.github/**'
            core:
              - 'packages/core/**'
            common:
              - 'packages/common/**'

  test_characterisation:
    name: Test Characterisation
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4

      - name: Setup node version
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: .nvmrc

      - name: ⛓️ SLSA Supply Chain Security
        uses: ministryofjustice/devsecops-actions/sca/slsa@805c9da24fe7083e24b8435a626463b25951d278 # v1.4.0
      
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build common
        run: npm run build -w packages/common

      - name: Run tests against core code
        run: npm run test:characterisation -w packages/core
      
  skip_notice:
    name: Skip Notification
    needs: changes
    if: needs.changes.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip Notification
        run: echo "No relevant paths modified. Skipping tests."    
