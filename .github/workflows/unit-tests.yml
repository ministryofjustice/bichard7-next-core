name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      common: ${{ fromJSON(steps.evaluate.outputs.filters).common }}
      characterisation: ${{ fromJSON(steps.evaluate.outputs.filters).characterisation }}
      ui_component: ${{ fromJSON(steps.evaluate.outputs.filters).ui_component }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Evaluate Run Condition
        id: evaluate
        uses: ./.github/actions/path-filter
        with:
          filters: |
            common:
              - '.github/**'
              - 'environment/**'
              - 'packages/common/**'
            characterisation:
              - '.github/**'
              - 'packages/common/**'
              - 'packages/core/**'
            ui_component:
              - '.github/**'
              - 'packages/common/**'
              - 'packages/core/**'
              - 'packages/ui/**'


  test_common:
    name: Test Common
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: ⛓️ SLSA Supply Chain Security
        uses: ministryofjustice/devsecops-actions/sca/slsa@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.4.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Unit Test Common
        run: npm run test -w packages/common

  test_characterisation:
    name: Test Characterisation
    needs: changes
    if: needs.changes.outputs.characterisation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: ⛓️ SLSA Supply Chain Security
        uses: ministryofjustice/devsecops-actions/sca/slsa@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.4.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build common
        run: npm run build -w packages/common

      - name: Run tests against core code
        run: npm run test:characterisation -w packages/core

  test_ui_component:
    name: Test UI Component
    needs: changes
    if: needs.changes.outputs.ui_component == 'true'
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4

      - name: Setup node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: ⛓️ SLSA Supply Chain Security
        uses: ministryofjustice/devsecops-actions/sca/slsa@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.4.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Cypress
        run: npm exec --no -- cypress install
      
      - name: Install GOV.UK Assets
        run: npm run -w packages/ui install:assets
      
      - name: Build core
        run: npm run build:core
      
      - name: Run UI component tests
        working-directory: packages/ui
        run: npm exec --no -- cypress run --component --spec 'cypress/component/**/*.cy.tsx' --reporter junit --reporter-options mochaFile=cypress/results/results-[hash].xml
        env:
          UI_IS_HTTPS: "true"
          TZ: "Europe/London"

      - name: Publish Cypress Test Report
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        if: always()
        with:
          name: UI Component Tests               
          path: 'packages/ui/cypress/results/**/*.xml'
          reporter: java-junit                    
          fail-on-error: true                    

      - name: Upload Cypress Artifacts (Videos & Screenshots)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            packages/ui/cypress/videos
            packages/ui/cypress/screenshots