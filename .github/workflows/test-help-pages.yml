name: Test Help pages

on:
  workflow_dispatch:
  push:
    paths: ["packages/help/**", ".github/workflows/test-help-pages.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f #v1.335.0
        with:
          working-directory: packages/help
          bundler-cache: true

      - name: Build
        working-directory: packages/help
        run: bundle exec jekyll build

      - name: Run tests
        working-directory: packages/help
        run: bundle exec htmlproofer --disable-external ./_site --url-swap '^/help/:/'
