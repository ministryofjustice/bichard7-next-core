name: Build and Test
on:
  workflow_dispatch:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      s3_web_proxy: ${{ fromJSON(steps.evaluate.outputs.filters).s3_web_proxy }}
      postgres: ${{ fromJSON(steps.evaluate.outputs.filters).postgres }}
      comparison_tests: ${{ fromJSON(steps.evaluate.outputs.filters).comparison_tests }}
      audit_logging: ${{ fromJSON(steps.evaluate.outputs.filters).audit_logging }}
      ui: ${{ fromJSON(steps.evaluate.outputs.filters).ui }}
      user_service: ${{ fromJSON(steps.evaluate.outputs.filters).user_service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Evaluate Run Condition
        id: evaluate
        uses: ./.github/actions/path-filter
        with:
          filters: |
            s3_web_proxy:
              - '.github/**'
              - 'packages/s3-web-proxy/**'
            postgres:
              - '.github/**'
              - '.nvmrc'
              - 'environment/**'
              - 'packages/ui/**'
              - 'packages/user-service/**'
              - 'packages/common/**'
              - 'packages/core/**'
            comparison_tests:
              - '.github/**'
              - '.nvmrc'
              - 'environment/postgres/**'
              - 'packages/common/**'
              - 'packages/core/**'
            audit_logging:
              - '.nvmrc'
              - '.github/**'
              - '.nvmrc'
              - 'environment/**'
              - 'packages/ui/**'
              - 'packages/user-service/**'
              - 'packages/common/**'
              - 'packages/core/**'
            ui:
              - '.nvmrc'
              - '.github/**'
              - '.nvmrc'
              - 'environment/**'
              - 'packages/ui/**'
              - 'packages/common/**'
              - 'packages/core/**'
            user_service:
              - '.github/**'
              - '.nvmrc'
              - 'environment/**'
              - 'packages/user-service/**'
              - 'packages/common/**'

  build_s3_web_proxy_image:
    name: Build S3 Web Proxy Image
    needs: changes
    if: needs.changes.outputs.s3_web_proxy == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Goss
        uses: ./.github/actions/install-goss

      - name: Build Docker Image
        uses: ./.github/actions/build-docker-image
        with:
          image_name: s3-web-proxy
          dockerfile: packages/s3-web-proxy/Dockerfile
          base-image-to-pull: nginx-nodejs-24-2023-supervisord
          aws-role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Run Goss Tests
        working-directory: packages/s3-web-proxy
        shell: bash
        run: make goss

  build_postgres_image:
    name: Build Postgres Image
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      ghcr_tag: ${{ steps.build-step.outputs.ghcr_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker Image
        id: build-step
        uses: ./.github/actions/build-docker-image
        with:
          image_name: bichard-postgres
          dockerfile: environment/postgres/Dockerfile
          context: environment/postgres
          push-to-ghcr: true

  build_audit_logging_image:
    name: Build Audit Logging Image
    needs: changes
    if: needs.changes.outputs.audit_logging == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write

    outputs:
      ghcr_tag: ${{ steps.build-step.outputs.ghcr_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout audit logging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'ministryofjustice/bichard7-next-audit-logging'
          path: "bichard7-next-audit-logging"

      - name: Build Docker Image
        id: build-step
        uses: ./.github/actions/build-docker-image
        with:
          image_name: audit-log-api
          dockerfile: bichard7-next-audit-logging/src/audit-log-api/Dockerfile
          context: bichard7-next-audit-logging
          base-image-to-pull: nodejs-24-2023
          aws-role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          push-to-ghcr: true

  test_postgres:
    name: Test Postgres
    needs: [changes, build_postgres_image]
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull postgres container
        uses: ./.github/actions/pull-docker-image
        with:
          image_tag: ${{ needs.build_postgres_image.outputs.ghcr_tag }}

      - name: Spin up the PostgreSQL database
        run: npm run postgres

      - name: Run Postgres function tests
        shell: bash
        run: DB_HOST=172.17.0.1 bash ./environment/postgres/tests/test-all.sh

  comparison_tests:
    name: Comparison Tests
    needs: [changes, build_postgres_image]
    if: needs.changes.outputs.comparison_tests == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull postgres container
        uses: ./.github/actions/pull-docker-image
        with:
          image_tag: ${{ needs.build_postgres_image.outputs.ghcr_tag }}

      - name: Setup node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Node Packages
        run: npm ci --ignore-scripts --no-audit

      - name: Build Common
        run: npm run build -w packages/common

      - name: Spin up the PostgreSQL database
        run: npm run postgres

      - name: Run E2E comparison tests against Core Phase 1
        run: npm run -w packages/core test:compare:phase1

      - name: Run E2E comparison tests against Core Phase 2
        run: npm run -w packages/core test:compare:phase2

      - name: Run E2E comparison tests against Core Phase 3
        run: npm run -w packages/core test:compare:phase3

  test_ui:
    name: Test UI
    needs: [changes, build_postgres_image, build_audit_logging_image]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull postgres container
        uses: ./.github/actions/pull-docker-image
        with:
          image_tag: ${{ needs.build_postgres_image.outputs.ghcr_tag }}

      - name: Pull audit log API container
        uses: ./.github/actions/pull-docker-image
        with:
          image_tag: ${{ needs.build_audit_logging_image.outputs.ghcr_tag }}

      - name: Setup node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Node Packages
        run: npm ci --ignore-scripts --no-audit

      - name: Build Common
        run: npm run build -w packages/common

      - name: Build Core
        run: npm run build -w packages/core

      - name: Start Services
        run: docker compose --project-name bichard -f environment/docker-compose.yml up -d --wait activemq localstack db-seed audit-log-api

      - name: Run code-based unit tests
        run: npm run -w packages/ui test:unit

      - name: Run integration tests
        run: npm run -w packages/ui test:integration

  test_user_service:
    name: Test User Service
    needs: [changes, build_postgres_image, build_audit_logging_image]
    if: needs.changes.outputs.user_service == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull postgres container
        uses: ./.github/actions/pull-docker-image
        with:
          image_tag: ${{ needs.build_postgres_image.outputs.ghcr_tag }}

      - name: Pull audit log API container
        uses: ./.github/actions/pull-docker-image
        with:
          image_tag: ${{ needs.build_audit_logging_image.outputs.ghcr_tag }}

      - name: Setup node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Node Packages
        run: npm ci --ignore-scripts --no-audit

      - name: Build Common
        run: npm run build -w packages/common

      - name: Start Services
        run: docker compose --project-name bichard -f environment/docker-compose.yml up -d --wait db-seed audit-log-api

      - name: Run code-based unit tests
        run: npm run -w packages/user-service test:unit

      - name: Run integration tests
        run: npm run -w packages/user-service test:integration

  test_user_service_e2e:
    name: Test User Service e2e
    needs: [changes, build_postgres_image]
    if: needs.changes.outputs.user_service == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Run across 4 parallel runners
        machines: [1, 2, 3, 4]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull postgres container
        uses: ./.github/actions/pull-docker-image
        with:
          image_tag: ${{ needs.build_postgres_image.outputs.ghcr_tag }}

#      - name: Pull audit log API container
#        uses: ./.github/actions/pull-docker-image
#        with:
#          image_tag: ${{ needs.build_audit_logging_image.outputs.ghcr_tag }}

      - name: Setup node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Node Packages
        run: npm ci --ignore-scripts --no-audit

      - name: Install GOV.UK Assets
        run: npm run -w packages/user-service install:assets

      - name: Install Cypress
        run: npm exec --no -- cypress install

      - name: Build Common
        run: npm run build -w packages/common

      - name: Build the user service
        run: npm run -w packages/user-service build

      - name: Start Services
        run: docker compose --project-name bichard -f environment/docker-compose.yml up -d --wait db-seed

      - name: Start User Service
        run: |
          npm run -w packages/user-service start &
          timeout 30s bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'

#      - name: Restore timings
#        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
#        with:
#          path: packages/user-service/timings.json
#          key: cypress-timings-${{ github.ref_name }}
#          restore-keys: |
#            cypress-timings-main

      - name: Run e2e tests
        working-directory: packages/user-service
        run: |
          SPECS=$(node ./scripts/split-specs.mjs cypress/e2e)
          if [ -n "$SPECS" ]; then
            npm exec --no -- cypress run --e2e --spec "$SPECS" --reporter junit --reporter-options mochaFile=cypress/results/results-[hash].xml
          fi
        env:
          TZ: "Europe/London"
          SPLIT_TOTAL: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
#          TIMINGS_FILE: timings.json

      - name: Publish Cypress Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: User Service e2e Tests
          path: 'packages/user-service/cypress/results/**/*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Upload Cypress Artifacts (Videos & Screenshots)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            packages/user-service/cypress/videos
            packages/user-service/cypress/screenshots