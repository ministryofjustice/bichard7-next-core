name: "Code Formatter"
description: "Format files within a PR"

inputs:
  ignore-files:
    description: "Files to ignore"
    required: false
    default: ""
  terraform-version:
    description: "Version of Terraform to use for formatting"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Check Branch exists and is not a fork.
      id: branch-exists
      env:
        IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.head.repo.full_name != '' }}
        IS_BRANCH: ${{ github.ref_type == 'branch' || github.event_name == 'pull_request' }}
        GITHUB_REF: ${{ github.head_ref || github.ref_name }}
      shell: bash
      run: |
        echo "branch_name=$GITHUB_REF" >> $GITHUB_ENV

        if [ "$IS_FORK" = "true" ]; then
          echo "Warning: Cannot code-format a forked branch!"
          echo "Finished: no Code Formatter changes."
          echo "result=1" >> $GITHUB_OUTPUT
        elif [ "$IS_BRANCH" != "true" ]; then
          echo "Warning: Triggered by a tag, skipping formatting."
          echo "result=1" >> $GITHUB_OUTPUT
        else
          echo "result=0" >> $GITHUB_OUTPUT
        fi

    - name: Get PR changed files
      id: detect-files
      if: steps.branch-exists.outputs.result == '0'
      shell: bash
      run: |
        # Handle both Pull Request and Push event diff refs safely
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        else
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.event.after }}"
          # Fallback to compare against the parent commit
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
        fi
        
        # Get raw changed file list
        git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" > .all_changed.txt || true
        
        # Filter out ignored files and workflow files
        IGNORE_FILES="${{ inputs.ignore-files }}"
        > .filtered_changed.txt
        
        while IFS= read -r file; do
          [ -z "$file" ] && continue
        
          if [[ "$file" == .github/* ]]; then
            continue
          fi
        
          filename=$(basename "$file")
          skip=false
          if [ -n "$IGNORE_FILES" ]; then
            IFS=',' read -ra IGNORES <<< "$IGNORE_FILES"
            for ignore in "${IGNORES[@]}"; do
              ignore_trimmed=$(echo "$ignore" | xargs)
              if [[ "$filename" == "$ignore_trimmed" ]]; then
                skip=true
                break
              fi
            done
          fi
        
          if [ "$skip" = "false" ]; then
            echo "$file" >> .filtered_changed.txt
          fi
        done < .all_changed.txt
        
        # Group into file lists
        grep -E '\.py$' .filtered_changed.txt > .py_files.txt || true
        grep -E '\.(tf|tfvars)$' .filtered_changed.txt > .tf_files.txt || true
        grep -E '\.(yaml|yml|md|html\.md|json)$' .filtered_changed.txt > .prettier_files.txt || true
        
        # Output booleans for execution conditions
        [ -s .py_files.txt ] && echo "has_python=true" >> $GITHUB_OUTPUT || echo "has_python=false" >> $GITHUB_OUTPUT
        [ -s .tf_files.txt ] && echo "has_terraform=true" >> $GITHUB_OUTPUT || echo "has_terraform=false" >> $GITHUB_OUTPUT
        [ -s .prettier_files.txt ] && echo "has_prettier=true" >> $GITHUB_OUTPUT || echo "has_prettier=false" >> $GITHUB_OUTPUT

    - name: Format Python files
      if: steps.detect-files.outputs.has_python == 'true'
      shell: bash
      run: |
        pipx install --cooldown 3 autopep8
        xargs autopep8 --in-place < .py_files.txt

    - name: Setup Terraform
      if: steps.detect-files.outputs.has_terraform == 'true'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "${{ inputs.terraform-version }}"
        terraform_wrapper: false

    - name: Format Terraform files
      if: steps.detect-files.outputs.has_terraform == 'true'
      shell: bash
      run: |
        while IFS= read -r file; do
          terraform fmt "$file"
        done < .tf_files.txt

    - name: Format files with Prettier
      if: steps.detect-files.outputs.has_prettier == 'true'
      shell: bash
      run: xargs npx prettier --print-width=150 --write < .prettier_files.txt

    - name: Remove non needed files from new commit
      if: steps.branch-exists.outputs.result == '0'
      shell: bash
      run: |
        rm -rf package-lock.json
        rm -rf package.json
        rm -rf node_modules
        rm -rf namespaces
        rm -rf modified_files.txt

    - name: Commit new files or finish script
      if: steps.branch-exists.outputs.result == '0'
      shell: bash
      run: |
        git ls-files --deleted -z | git update-index --assume-unchanged -z --stdin
        if [ -n "$(git status --porcelain=1 --untracked-files=no)" ]; then
          # Stage the changes
          git add --ignore-removal .

          # Get the amended file names and save them.
          git diff --staged --name-only > changed_files.txt
          echo "List files amended by formatter"
          cat changed_files.txt

          commit_oid=$(git rev-parse HEAD)
          echo "commit_oid=$commit_oid" >> $GITHUB_ENV

          # Initialize an empty JSON object for the additions
          files_for_commit='{"additions": []}'

          # Read the changed files from changed_files.txt
          while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              # Get the content for the file
              file_content="$(cat "$file")"

              # Base64 encode the contents of the file
              base64_content=$(base64 -w 0 <<< "$file_content")

              # Construct a JSON object for this file and append it to the additions array
              files_for_commit=$(echo "$files_for_commit" | jq --arg path "$file" --arg content "$base64_content" \
              '.additions += [{ "path": $path, "contents": $content }]')
            fi
          done < changed_files.txt

          # Output the final JSON array
          echo "$files_for_commit" > files_for_commit.json

          # Error handling for `jq` output
          echo "Check for valid json output"
          if ! jq . files_for_commit.json; then
            echo "Error reading files_for_commit.json"
            exit 1
          fi

          # Get the Repo Owner and Name
          repo_owner=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
          repo_name=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          echo "The calling repo is $repo_owner/$repo_name"

          commit_message="Commit changes made by code formatters"

          # Prepare the mutation payload
          mutation_payload=$(jq -n \
            --arg branch_name "$branch_name" \
            --arg commit_oid "$commit_oid" \
            --arg repo_id "$repo_id" \
            --arg commit_message "$commit_message" \
            --arg repo_owner "$repo_owner" \
            --arg repo_name "$repo_name" \
            --argjson fileChanges "$(jq -c . < files_for_commit.json)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: "\($repo_owner)/\($repo_name)",
                    branchName: $branch_name
                  },
                  message: {
                    headline: $commit_message
                  },
                  fileChanges: $fileChanges,
                  expectedHeadOid: $commit_oid
                }
              }
            }')

          echo "Mutation Payload: $mutation_payload"    

          # Send the mutation request to GitHub's GraphQL API and capture the response
          RESPONSE=$(curl -X POST -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$mutation_payload" https://api.github.com/graphql)

          # Parse the commit OID from the response
          COMMIT_OID=$(echo "$RESPONSE" | jq -r ".data.createCommitOnBranch.commit.oid")

          # Check if the commit was successfully created
          if [ "$COMMIT_OID" != "null" ]; then
            echo "Commit successfully created with OID: $COMMIT_OID"
          else
            echo "Error creating commit: $RESPONSE"
          fi

          echo "Finished: Code Formatter changes applied."
        else
          echo "Finished: no Code Formatter changes."
        fi