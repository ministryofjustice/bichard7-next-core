name: "Build Docker Image"
description: "Builds a Docker image"

inputs:
  image_name:
    description: "The name of the image"
    required: true
  dockerfile:
    description: "The filepath of the Dockerfile"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build image and export to Docker engine
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        load: true # Crucial: loads image into local `docker images`
        push: false
        tags: '${{ inputs.image_name }}:latest'
        cache-from: type=gha,scope=${{ inputs.image_name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}