---
version: 0.2

env:
  variables:
    REPOSITORY_NAME: "conductor"
    SOURCE_REPOSITORY_NAME: "amazon-linux2023-base"
  exported-variables:
    - CONDUCTOR_IMAGE_HASH

phases:
  build:
    commands:
      - ./scripts/install-goss.sh
      - cd environment/conductor
      - ../../scripts/build_and_push_image.sh
