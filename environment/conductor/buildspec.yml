---
version: 0.2

env:
  variables:
    REPOSITORY_NAME: "conductor"
    SOURCE_REPOSITORY_NAME: "amazon-linux2023-base"
    CONTEXT_DIR: environment/conductor
  exported-variables:
    - CONDUCTOR_IMAGE_HASH

phases:
  build:
    commands:
      - ./scripts/build-image.sh
  test:
    commands:
      - ./scripts/install-goss.sh
      - cd environment/conductor
      - make goss
  push:
    commands:
      - . ./scripts/push-image.sh
