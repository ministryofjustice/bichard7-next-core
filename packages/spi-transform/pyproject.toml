[project]
name = "spi-transform"
version = "0.1.0"
description = "Transforms SPIResults xml messages and writes to a deltalake table"
readme = "README.md"
authors = [
    { name = "joe-u-mt", email = "joe.unwin@madetech.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.59",
    "deltalake>=1.6.2",
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "xmltodict>=1.0.4",
]

[project.scripts]
spi-transform = "spi_transform.batch_transform:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
