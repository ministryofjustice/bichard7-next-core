version: 0.2

env:
  variables:
    REPOSITORY_NAME: "nginx-auth-proxy"
    SOURCE_REPOSITORY_NAME: "amazon-linux2023-base"
    CONTEXT_DIR: "packages/nginx-auth-proxy"
  exported-variables:
    - NGINX_AUTH_PROXY_HASH

phases:
  install:
    commands:
      - ./scripts/install-goss.sh

  build:
    commands:
      - ./scripts/build-image.sh
      - (cd "$CONTEXT_DIR" && make goss)

  post_build:
    commands:
      - . ./scripts/push-image.sh
